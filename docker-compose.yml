# KitchenOwl：全家共用的购物清单、菜谱、一周菜单和共同账目。前后端一体的官方镜像，SQLite 存 /data，
# 不额外起数据库。
#
# 登录全走核心的 OIDC：密码登录关掉后注册路由一并移除；onboarding 表单（建第一个账号）不受那个开关管，
# 用 DISABLE_ONBOARDING 一并关掉，第一个账号由首次 OIDC 登录自动创建。入口直接落在 /signin?launch=custom，
# 打开即发起 OIDC，不用点登录按钮。云吞 OIDC 的 token 端点只收 client_secret_post（上游写死）。
# 第一个登录的人建"家庭"并邀家人；没有服务器管理员，家庭内的权限由家庭 owner 管，家人流程都走得到（见 README）。
services:
  web:
    image: tombursch/kitchenowl:v0.8.1@sha256:6a048135399691da25aec04ea107666cb7ce8eb46f5fed9a46a5ac254fe23073
    # 镜像默认 root 启动再 gosu 到 kitchenowl(1000)；直接以 1000 运行时 entrypoint 跳过 chown，
    # 数据目录由核心按 user 交给 1000:1000。
    user: "1000:1000"
    environment:
      TZ: ${TZ}
      # 网页的公开地址：CORS 按它放行，OIDC 回调按它拼，和核心登记的回调路径一致。
      FRONT_URL: ${WONTON_APP_URL}
      # 不覆盖时回落到镜像里写死的 super-secret，必须用核心生成的密钥。
      JWT_SECRET_KEY: ${WONTON_SECRET_JWT_KEY}
      # 只认云吞登录：密码登录关掉即同时禁用注册（上游行为）。
      DISABLE_USERNAME_PASSWORD_LOGIN: "true"
      DISABLE_ONBOARDING: "true"
      OIDC_ISSUER: ${WONTON_OIDC_ISSUER}
      OIDC_CLIENT_ID: ${WONTON_OIDC_CLIENT_ID}
      OIDC_CLIENT_SECRET: ${WONTON_OIDC_CLIENT_SECRET}
    volumes:
      # SQLite 库（/data/database.db）和上传的图片（/data/upload）。
      - ${WONTON_APP_DATA}/data:/data
    healthcheck:
      # 上游 health 接口（长后缀是上游源码里的固定常量，前端也调它）；查 8080 把前端静态层一并验到。
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/api/health/8M4F88S8ooi4sMbLBfkkV7ctWwgibW6V"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      start_interval: 2s

x-wonton:
  spec: "0.12"
  id: org.kitchenowl.kitchenowl
  version: 0.1.0
  kind: app
  title: { zh: 购物清单（KitchenOwl）, en: Shopping List (KitchenOwl) }
  description:
    zh: 全家共用一张买菜清单：想买什么随时加，买完划掉，实时同步；还能存菜谱、排一周菜单、记共同的账
    en: One shared shopping list for the whole family, always in sync — with recipes, a weekly meal plan and shared expenses
  icon: icon.png
  notices: [NOTICE]
  screenshots: [screenshots/home.png]
  author: { name: geraldpeng6, url: https://github.com/geraldpeng6 }
  homepage: https://kitchenowl.org
  license: AGPL-3.0-only
  tags:
    zh: [购物清单, 菜谱, 记账, 效率]
    en: [Shopping list, Recipes, Finance, Productivity]
  about:
    zh: |
      全家人共用一张买菜清单：做饭时想买什么随手加进去，到了超市打开手机照着买，买完划掉，大家的手机上马上同步，谁改的都看得到。

      菜谱存在应用里，做菜时照着步骤来，缺的食材一键加进清单；可以照菜谱排一周的菜单，家里共同的账（谁垫了钱、花在哪里）也能记清楚。

      打开就用云吞的账号登录，不用再注册。第一次进去先建一个"家庭"，再在家庭设置里把家人邀请进来：家人先用云吞账号登录一次，才会出现在邀请名单里。
    en: |
      One shopping list shared by the whole family: add items while cooking, open your phone at the store and shop the list, tick things off and everyone's phone updates instantly, with a record of who changed what.

      Recipes live in the app — cook along with the steps and add missing ingredients to the list with one tap. Plan the week's meals from your recipes and keep track of shared expenses (who paid, and for what).

      Opens straight into your Wonton account — no separate sign-up. On first use, create a household and invite family from its settings: they appear in the invite list after signing in with their Wonton account once.
  release_notes:
    zh: 首个版本：KitchenOwl v0.8.1，用云吞账号登录。
    en: "Initial release: KitchenOwl v0.8.1, signed in with your Wonton account."
  webui:
    service: web
    port: 8080
    # 打开网页直接发起 OIDC 登录（上游登录页的免点击入口），已登录的用户会被应用带回主页。
    path: /signin?launch=custom
    sso: oidc
    oidc:
      # 上游把回调固定在 FRONT_URL/signin/redirect（浏览器回跳页把 code+state POST 回后端）。
      redirect_paths: [/signin/redirect]
      token_endpoint_auth_method: client_secret_post
  secrets:
    # 会话签名密钥，由核心生成。
    jwt_key: { generate: { bytes: 32 } }
  permissions:
    # 只有"从网址导入菜谱"要出网：服务端替你抓取网页解析食材（带 SSRF 过滤）。清单、菜谱、菜单和账目都不出网。
    - network.egress
  # 上游没写最低内存；本机空闲实测约 xxxM，取 512M（装机实测后更新）。
  requirements:
    arch: [amd64, arm64]
    memory: 512M
